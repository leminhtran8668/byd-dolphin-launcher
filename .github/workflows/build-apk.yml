name: Build BYD Dolphin Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build debug APK (V1+V2 signed)
        run: |
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Verify APK signature (must have v1 for DiLink)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK" || true
          # Also show zip contents briefly
          unzip -l "$APK" | head -30
          echo "APK size: $(wc -c < "$APK") bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: byd-dolphin-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "### BYD Dolphin Launcher APK (DiLink)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: com.byd.dolphin.launcher" >> "$GITHUB_STEP_SUMMARY"
          echo "- targetSdk 29, V1+V2 signing, legacy jni packaging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Author: Lê Minh" >> "$GITHUB_STEP_SUMMARY"
